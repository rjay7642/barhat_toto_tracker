<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totos – Toto Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/style.css">

<style>
body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui}
header{padding:14px 16px;border-bottom:1px solid #1f2933;display:flex;justify-content:space-between}
.container{max-width:720px;margin:auto;padding:14px}
.card{background:#111827;border-radius:14px;padding:14px;margin-bottom:14px}
input{width:100%;background:#0b1220;border:1px solid #1f2933;border-radius:8px;padding:10px;color:#e5e7eb}
button{margin-top:10px;width:100%;padding:10px;border:none;border-radius:10px;background:#38bdf8;font-weight:600}
.list{display:grid;gap:8px}
.item{background:#0b1220;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;font-size:13px}
</style>
</head>

<body>
<header>
  <div>Totos</div>
  <a href="../index.html" style="color:#9ca3af;text-decoration:none">Home</a>
</header>

<main class="container">

<div class="card">
  <input id="name" placeholder="Toto name">
  <button id="addBtn">Add Toto</button>
</div>

<div class="card">
  <div class="list" id="list"></div>
</div>

<script type="module" src="../assets/js/pages/totos.js"></script>
</body>
</html>
