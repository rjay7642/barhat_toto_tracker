<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trips – Toto Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/style.css">

<style>
body{
  margin:0;
  background:#0f172a;
  color:#e5e7eb;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

header{
  padding:14px 16px;
  border-bottom:1px solid #1f2933;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:15px;
  margin:0;
  font-weight:600;
}

header a{
  color:#9ca3af;
  text-decoration:none;
  font-size:13px;
}

.container{
  max-width:720px;
  margin:auto;
  padding:14px;
}

.card{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

label{
  font-size:12px;
  color:#9ca3af;
  display:block;
  margin-bottom:4px;
}

select,input{
  width:100%;
  background:#0b1220;
  border:1px solid #1f2933;
  border-radius:8px;
  padding:10px;
  color:#e5e7eb;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  background:#38bdf8;
  color:#022c22;
  cursor:pointer;
}

.list{
  display:grid;
  gap:10px;
}

.item{
  background:#0b1220;
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.muted{
  color:#9ca3af;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>Trips</h1>
  <a href="../index.html">Home</a>
</header>

<main class="container">

  <!-- Add trip -->
  <div class="card">

    <div style="margin-bottom:10px;">
      <label>Toto</label>
      <select id="totoSelect"></select>
    </div>

    <div class="row">
      <div>
        <label>Date</label>
        <input type="date" id="tripDate">
      </div>

      <div>
        <label>How many trips</label>
        <input type="number" id="tripCount" min="1" placeholder="ex: 5">
      </div>
    </div>

    <button id="saveBtn">Save Trip</button>

  </div>

  <!-- Today / selected date trips -->
  <div class="card">
    <div class="muted" style="margin-bottom:8px;">
      Trips for selected date
    </div>

    <div class="list" id="tripList"></div>
  </div>

</main>

<script type="module" src="../assets/js/pages/trips.js"></script>
</body>
</html>
