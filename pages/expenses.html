<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expenses – Toto Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/style.css">

<style>
body{
  margin:0;
  background:#0f172a;
  color:#e5e7eb;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

header{
  padding:14px 16px;
  border-bottom:1px solid #1f2933;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:15px;
  margin:0;
  font-weight:600;
}

header a{
  color:#9ca3af;
  text-decoration:none;
  font-size:13px;
}

.container{
  max-width:720px;
  margin:auto;
  padding:14px;
}

.card{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

label{
  font-size:12px;
  color:#9ca3af;
  display:block;
  margin-bottom:4px;
}

select,input{
  width:100%;
  background:#0b1220;
  border:1px solid #1f2933;
  border-radius:8px;
  padding:10px;
  color:#e5e7eb;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  background:#38bdf8;
  color:#022c22;
  cursor:pointer;
}

.list{
  display:grid;
  gap:10px;
}

.item{
  background:#0b1220;
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.small{
  font-size:11px;
  color:#9ca3af;
}
</style>
</head>

<body>

<header>
  <h1>Expenses</h1>
  <a href="../index.html">Home</a>
</header>

<main class="container">

  <!-- Add expense -->
  <div class="card">

    <div style="margin-bottom:10px;">
      <label>Toto</label>
      <select id="totoSelect"></select>
    </div>

    <div class="row">
      <div>
        <label>Date</label>
        <input type="date" id="expDate">
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option value="Fuel">Fuel</option>
          <option value="Repair">Repair</option>
          <option value="Driver">Driver</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
<div style="margin-top:10px;">
  <label>Status</label>
  <select id="paidStatus">
    <option value="paid">Paid</option>
    <option value="unpaid">Unpaid</option>
  </select>
</div>

    <div style="margin-top:10px;">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="ex: 200">
    </div>

    <div style="margin-top:10px;">
      <label>Note (optional)</label>
      <input type="text" id="note" placeholder="optional">
    </div>

    <button id="saveBtn">Save Expense</button>

  </div>

  <!-- list -->
  <div class="card">

    <div class="small" style="margin-bottom:8px;">
      Expenses for selected date
    </div>

    <div class="list" id="expenseList"></div>

  </div>

</main>

<script type="module" src="../assets/js/pages/expenses.js"></script>
</body>
</html>
