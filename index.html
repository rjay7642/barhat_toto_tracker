<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Toto Manager – Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="assets/css/style.css">

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --card:#0f172a;
  --line:#1f2933;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#38bdf8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.app{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:100vh;
}

/* ---------------- sidebar ---------------- */

.sidebar{
  background:#020617;
  border-right:1px solid var(--line);
  padding:18px 14px;
}

.brand{
  font-size:17px;
  font-weight:700;
  margin-bottom:24px;
}

.nav{
  display:grid;
  gap:6px;
}

.nav a{
  text-decoration:none;
  color:var(--muted);
  font-size:13px;
  padding:10px 10px;
  border-radius:8px;
}

.nav a:hover{
  background:#0b1220;
  color:var(--text);
}

/* ---------------- main ---------------- */

.main{
  display:flex;
  flex-direction:column;
}

/* top bar */

.topbar{
  position:sticky;
  top:0;
  z-index:5;
  height:60px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:var(--panel);
}

.topbar h1{
  margin:0;
  font-size:15px;
  font-weight:600;
}

/* toolbar */

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
}

.toolbar input{
  background:#0b1220;
  border:1px solid var(--line);
  color:var(--text);
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
  width:200px;
}

.toolbar button{
  background:#0b1220;
  border:1px solid var(--line);
  color:var(--text);
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.toolbar button:hover{
  border-color:var(--accent);
}

/* content */

.container{
  padding:22px 26px 40px;
  max-width:1300px;
}

/* summary strip */

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}

.sum-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 14px;
}

.sum-box .label{
  font-size:11px;
  color:var(--muted);
}

.sum-box .value{
  margin-top:6px;
  font-size:18px;
  font-weight:600;
}

/* quick */

.quick{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

.quick a{
  background:var(--panel);
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:10px;
  text-decoration:none;
  color:var(--text);
  font-size:13px;
}

.quick a:hover{border-color:var(--accent);}

.section-title{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.5px;
  margin:10px 0 12px;
}

/* cards grid */

.toto-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:18px;
}

/* card */

.toto-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  display:grid;
  gap:14px;
}

.toto-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toto-name{
  font-size:15px;
  font-weight:600;
}

.today-status{
  font-size:11px;
  padding:4px 10px;
  border-radius:999px;
  background:#0b1220;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 8px;
  text-align:center;
}

.stat .value{
  font-size:15px;
  font-weight:600;
}

.stat .label{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

.card-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card-actions a{
  text-decoration:none;
  background:#0b1220;
  border:1px solid var(--line);
  color:var(--text);
  text-align:center;
  padding:8px 0;
  border-radius:8px;
  font-size:12px;
}

.card-actions a:hover{
  border-color:var(--accent);
}

.footer{
  margin-top:28px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="brand"> Barhat Toto Manager</div>

    <div class="nav">
      <a href="index.html">Dashboard</a>
      <a href="pages/attendance.html">Attendance</a>
      <a href="pages/trips.html">Trips</a>
      <a href="pages/expenses.html">Expenses</a>
      <a href="pages/totos.html">Totos</a>
      <a href="pages/drivers.html">Drivers</a>
      <a href="pages/locations.html">Locations</a>
      <a href="pages/reports.html">Reports / Admin</a>
    </div>
  </aside>

  <!-- main -->
  <div class="main">

    <!-- sticky header + tools -->
    <div class="topbar">
      <h1>Dashboard</h1>

      <div class="toolbar">
        <input id="searchBox" placeholder="Search toto...">
        <button id="sortUnpaid">Sort by Unpaid</button>
        <button id="sortExpense">Sort by Expense</button>
      </div>
    </div>

    <div class="container">

      <!-- light summary strip (visual only, no logic yet) -->
      <div class="summary">
        <div class="sum-box">
          <div class="label">Fleet overview</div>
          <div class="value">Live</div>
        </div>
        <div class="sum-box">
          <div class="label">Focus</div>
          <div class="value">Today</div>
        </div>
        <div class="sum-box">
          <div class="label">View</div>
          <div class="value">Monthly</div>
        </div>
        <div class="sum-box">
          <div class="label">Mode</div>
          <div class="value">Offline</div>
        </div>
      </div>

      <div class="quick">
        <a href="pages/totos.html">+ Add Toto</a>
        <a href="pages/attendance.html">Mark Attendance</a>
        <a href="pages/expenses.html">Add Expense</a>
      </div>

      <div class="section-title">TODAY OVERVIEW</div>

      <div class="toto-list" id="totoList"></div>

      <div class="footer">
        Made with Jaya Technology
      </div>

    </div>

  </div>

</div>

<script type="module" src="assets/js/pages/home.js"></script>

<!-- only UI helpers (home.js untouched) -->
<script>
/* search */
document.addEventListener("input",e=>{
  if(e.target.id!=="searchBox") return;
  const q=e.target.value.toLowerCase();
  document.querySelectorAll(".toto-card").forEach(c=>{
    const name=c.querySelector(".toto-name").textContent.toLowerCase();
    c.style.display=name.includes(q)?"":"none";
  });
});

/* very light client-side sort (DOM based) */
function sortCards(getValue){
  const wrap=document.getElementById("totoList");
  const cards=[...wrap.children];
  cards.sort((a,b)=>getValue(b)-getValue(a));
  cards.forEach(c=>wrap.appendChild(c));
}

document.getElementById("sortUnpaid").onclick=()=>{
  sortCards(card=>{
    const labels=[...card.querySelectorAll(".stat .label")];
    const idx=labels.findIndex(l=>l.textContent==="Unpaid");
    if(idx<0) return 0;
    const val=card.querySelectorAll(".stat .value")[idx].textContent
      .replace(/[₹,]/g,"");
    return Number(val||0);
  });
};

document.getElementById("sortExpense").onclick=()=>{
  sortCards(card=>{
    const labels=[...card.querySelectorAll(".stat .label")];
    const idx=labels.findIndex(l=>l.textContent==="This month");
    if(idx<0) return 0;
    const val=card.querySelectorAll(".stat .value")[idx].textContent
      .replace(/[₹,]/g,"");
    return Number(val||0);
  });
};
</script>

</body>
</html>
